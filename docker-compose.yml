services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-credentials}
      POSTGRES_USER: ${POSTGRES_USER:-credentials}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credentials}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-credentials} -d ${POSTGRES_DB:-credentials}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DEBUG: "False"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
