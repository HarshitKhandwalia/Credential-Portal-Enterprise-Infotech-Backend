<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your credential invite</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f5;font-family:Arial,Helvetica,sans-serif;color:#222;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;padding:32px 28px;">
          <tr>
            <td style="font-size:16px;line-height:1.6;">
              <p style="margin:0 0 16px;">Hey {{ name | default: 'there' }},</p>
              <p style="margin:0 0 24px;">Greetings! Choose how you would like to add your digital pass:</p>

              <table role="presentation" cellpadding="0" cellspacing="0" align="center" style="margin:0 auto 24px;">
                <tr>
                  <td align="center" valign="middle" style="padding:0 8px 0 0;">
                    <a href="{{ apple_wallet_url | default: '#' }}" target="_blank" rel="noopener noreferrer" style="display:inline-block;line-height:0;text-decoration:none;">
                      <img src="__APPLE_BUTTON_PNG_URL__" alt="Add to Apple Wallet" width="111" height="35" style="display:block;border:0;outline:none;text-decoration:none;width:111px;height:35px;">
                    </a>
                  </td>
                  <td align="center" valign="middle" style="padding:0 0 0 8px;">
                    <a href="{{ google_wallet_url | default: '#' }}" target="_blank" rel="noopener noreferrer" style="display:inline-block;line-height:0;text-decoration:none;">
                      <img src="__GOOGLE_BUTTON_PNG_URL__" alt="Add to Google Wallet" width="111" height="35" style="display:block;border:0;outline:none;text-decoration:none;width:111px;height:35px;">
                    </a>
                  </td>
                </tr>
              </table>

              <p style="margin:0;">Open the link for your device, then tap the wallet button to add your pass.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
